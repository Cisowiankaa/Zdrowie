name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name Zdrowie main_v14.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: Zdrowie-Windows-Portable
          path: dist/Zdrowie/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Zdrowie-Windows-Setup
          path: installer_output/*.exe
