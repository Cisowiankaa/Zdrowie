name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall -q .

      - name: Smoke import
        run: |
          python - <<'PY'
          import db
          import domain_db
          import runtime_mode
          import notifications_service
          import backup_service
          print("Smoke import OK")
          PY

      - name: Fresh database regression test
        run: python -m unittest -v test_fresh_database.py
